name: patch-ram-pipeline

on:
  push:
    paths:
      - scripts/patch-ram-pipeline.py
      - .github/workflows/patch-ram-pipeline.yml

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply pipeline/RAM patches
        run: python3 scripts/patch-ram-pipeline.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/patch-ram-pipeline.py .github/workflows/patch-ram-pipeline.yml
          git add -A
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "fix: wire RAM spec matching through analyze pipeline"
          git push
