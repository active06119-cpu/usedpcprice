name: remove-debug-output

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/remove-debug-output.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Remove debug-output and this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          changed=0
          if [ -d debug-output ]; then
            git rm -r debug-output
            changed=1
          fi
          if [ -f .github/workflows/remove-debug-output.yml ]; then
            git rm .github/workflows/remove-debug-output.yml
            changed=1
          fi
          if [ "$changed" = "1" ]; then
            git commit -m "chore: remove debug-output dumps"
            git push
          fi
