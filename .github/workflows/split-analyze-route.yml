name: split-analyze-route

on:
  push:
    paths:
      - scripts/split-analyze-route.py
      - .github/workflows/split-analyze-route.yml
  workflow_dispatch:

jobs:
  split:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Split analyze route
        run: python3 scripts/split-analyze-route.py
      - name: Commit result and remove one-shot workflow
        run: |
          rm -f .github/workflows/split-analyze-route.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/analyze src/app/api/analyze/route.ts scripts/split-analyze-route.py
          git add -u .github/workflows/split-analyze-route.yml
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "refactor: split analyze route into src/lib/analyze modules"
          git push
