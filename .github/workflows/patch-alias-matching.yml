name: patch-alias-matching

on:
  push:
    paths:
      - scripts/patch-alias-matching.py
      - .github/workflows/patch-alias-matching.yml
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply alias matching to pipeline
        run: python3 scripts/patch-alias-matching.py
      - name: Commit and remove workflow
        run: |
          rm -f .github/workflows/patch-alias-matching.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/analyze/pipeline.ts scripts/patch-alias-matching.py
          git add -u .github/workflows/patch-alias-matching.yml
          if git diff --cached --quiet; then
            echo No changes
            exit 0
          fi
          git commit -m "refactor: use alias-safe part matching in analyze pipeline"
          git push
