name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: All unit tests
        run: npm test -- --ci
      - name: Ingest + analyze matching coverage
        run: npx jest --ci src/lib/ingest src/lib/analyze/__tests__ src/lib/engine/pricing/__tests__/guards.test.ts
